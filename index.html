<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BoostToppers</title>
<style>

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;width:100%;max-width:520px}nav button{flex:1;border:0;background:none;color:var(--tx2);padding:10px 0;font-size:12px;font-weight:600;cursor:pointer}nav button i{display:block;font-style:normal;font-size:22px}nav button.on{color:var(--pk)}

.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}.sheet>div{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:16px;cursor:pointer}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--card))}.opt.ok{border-color:#16A34A;background:#16A34A22}.opt.bad{border-color:#DC2626;background:#DC262622}

.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat .card{margin:0;text-align:center}.stat b{font-size:26px;display:block}
.hd{background:linear-gradient(160deg,#4C1D95,#7C3AED 70%,#6D28D9);color:#fff;border-radius:0 0 26px 26px;margin:-20px -20px 14px;padding:22px 20px 18px}.br{font-size:30px;font-weight:800}.br span{font-size:13px;border:2px solid #BEF264;color:#BEF264;border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:middle}.gr{display:flex;align-items:center;gap:12px;margin-top:12px;line-height:1.3}.gr b{font-size:22px}.stk{margin-left:auto;border:1px solid #fff5;border-radius:14px;padding:8px 12px;font-size:13px;text-align:center}.stk b{font-size:17px;display:block;color:#BEF264}.bn{background:linear-gradient(120deg,#1E1B4B,#4C1D95);color:#fff;border-radius:22px;padding:20px;margin:6px 0}.bn .big{font-size:40px;font-weight:800;color:#BEF264;line-height:1}.bn p{margin:6px 0 12px;opacity:.9}.qi{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.qi button{background:#ffffff1f;border:0;color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;cursor:pointer}.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px}.cc{flex:none;width:136px;border:0;border-radius:18px;padding:14px;background:linear-gradient(150deg,var(--c),#4C1D95);color:#fff;text-align:left;cursor:pointer;font-size:15px}.cc b{display:block;margin-top:8px}.cc span{font-size:12px;opacity:.9}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tl{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 4px;font-size:11px;font-weight:600;cursor:pointer;display:grid;gap:6px;justify-items:center}.tl svg{color:var(--ac)}.ai{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#4C1D95,#6D28D9);color:#fff;border-radius:22px;padding:16px;margin:16px 0}.ai p{margin:2px 0 10px;font-size:14px}.ai .btn{background:#BEF264;color:#1E1B4B}.pg{display:flex;align-items:center;gap:12px}.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--pk) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center;flex:none}.ring span{width:64px;height:64px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800}nav .bt{flex:none;width:64px;height:64px;border-radius:50%;margin-top:-26px;background:var(--g);color:#BEF264;font-size:20px;font-weight:800;border:3px solid var(--card);box-shadow:0 0 18px #a3e63577;padding:0}
.bhd{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 30%,var(--bg)),var(--bg));margin:-20px -20px 0;padding:20px}.sr{display:flex;gap:10px;align-items:center}.mn{border:0;background:none;color:var(--tx);padding:6px;cursor:pointer}.gl{display:flex;gap:12px;align-items:center;margin:14px 0}.gl p{margin:0;display:flex;align-items:center;gap:4px}.pl{display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,#BEF264 40%,var(--card));border-radius:14px;padding:12px 14px;font-weight:700}.pl button{border:0;background:none;color:var(--ac);font-weight:700;font-size:16px;cursor:pointer}.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}.tb{border:0;border-radius:16px;padding:14px 6px;background:var(--card);color:var(--tx);font-weight:700;font-size:14px;display:grid;justify-items:center;gap:6px;border-bottom:4px solid var(--ln);cursor:pointer}.tb.on{background:var(--ac);color:#fff;border-bottom-color:#4C1D95}.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.ft{border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--card);padding:0;text-align:center;font-size:14px;font-weight:700;color:var(--tx);cursor:pointer}.ft div{padding:12px 6px}.ft span{display:block;background:var(--ac);color:#fff;padding:6px;font-size:13px}.vo{display:flex;align-items:center;gap:8px;overflow-x:auto;margin:16px 0 6px}.vo b{font-size:12px;flex:none;width:70px}
@media(prefers-reduced-motion:no-preference){.btn,.row,.chip{transition:transform .12s}.btn:active,.row:active{transform:scale(.98)}}
</style></head><body><div id="app"></div><div id="nav"></div>
<script>
const CATS={A:{n:"JEE Main & Advanced",k:"jee",c:"#7C3AED",s:["Physics","Chemistry","Mathematics"],d:"Prepare for engineering entrance examinations with structured learning, advanced problem-solving, regular practice, and mock tests.",b:["Titans","Infinity","Pinnacle","Quantum","Apex","Dominators","Invictus","Ascend","Mavericks","Zenith"]},

["Physics","A ball is thrown up at 20 m/s (g = 10 m/s²). Maximum height?",["10 m","20 m","30 m","40 m"],1,"h = v²/2g = 400/20 = 20 m."],

["Biology","Chromosomes in a human somatic cell?",["23","44","46","48"],2,"Humans have 23 pairs, so 46."]];
