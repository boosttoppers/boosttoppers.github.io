<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo.png">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boost Toppers</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f5f6fa;
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
background:white;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.left-nav{
display:flex;
align-items:center;
gap:12px;
}

.menu-icon{
font-size:28px;
cursor:pointer;
}

.logo{
height:55px;
}

.login-btn{
background:#6c5ce7;
color:white;
border:none;
padding:8px 16px;
border-radius:6px;
}

.slider{
width:100%;
overflow:hidden;
}

.slides{
display:none;
}

.slides img{
width:100%;
display:block;
}

.platform{
text-align:center;
padding:35px 20px;
background:linear-gradient(120deg,#eef1ff,#ffffff);
}

.platform span{
color:#6c5ce7;
}

.start-btn{
background:#6c5ce7;
color:white;
border:none;
padding:12px 30px;
border-radius:8px;
margin-top:15px;
}

.features{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:20px;
}

.feature-box{
background:white;
padding:20px;
text-align:center;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.categories{
padding:20px;
}

.category-card{
background:white;
padding:18px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.call-btn{
position:fixed;
bottom:20px;
right:20px;
background:#6c5ce7;
color:white;
font-size:22px;
width:55px;
height:55px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
}

.login-popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
}

.login-box{
background:white;
padding:20px;
border-radius:10px;
text-align:center;
width:300px;
}

.otp-container{
display:flex;
justify-content:center;
gap:6px;
margin-top:10px;
}

.otp-box{
width:35px;
height:40px;
text-align:center;
font-size:18px;
}

.otp-btn{
background:#6c5ce7;
color:white;
border:none;
padding:10px;
margin-top:10px;
width:100%;
}

</style>

</head>

<body>

<div class="navbar">

<div class="left-nav">
<div class="menu-icon">☰</div>
<img src="logo.png" class="logo">
</div>

<button class="login-btn" onclick="openLogin()">Login/Register</button>

</div>


<div class="slider">

<div class="slides">
<img src="banner1.jpg">
</div>

<div class="slides">
<img src="banner2.jpg">
</div>

<div class="slides">
<img src="banner3.jpg">
</div>

</div>


<section class="platform">

<h2>
India’s <span>Trusted & Advanced</span><br>
Learning Platform
</h2>

<p>
Start your JEE & NEET preparation with Boost Toppers
</p>

<button class="start-btn">Get Started</button>

</section>


<section class="features">

<div class="feature-box">
📺
<h3>Daily Live</h3>
</div>

<div class="feature-box">
📚
<h3>10 Million+</h3>
</div>

<div class="feature-box">
⏰
<h3>24 x 7</h3>
</div>

<div class="feature-box">
🏫
<h3>100+</h3>
</div>

</section>


<section class="categories">

<h2>Exam Categories</h2>

<div class="category-card">
<h3>NEET</h3>
<button>Explore →</button>
</div>

<div class="category-card">
<h3>IIT JEE</h3>
<button>Explore →</button>
</div>

</section>


<div class="call-btn">📞</div>


<!-- LOGIN POPUP -->

<div id="loginPopup" class="login-popup">

<div class="login-box">

<h2>Login to Boost Toppers</h2>

<input type="text" id="mobile" placeholder="Enter Mobile Number">

<button class="otp-btn" onclick="sendOTP()">Get OTP</button>

<div id="recaptcha-container"></div>

<div class="otp-container">

<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">

</div>

<button class="otp-btn" onclick="verifyOTP()">Verify & Proceed</button>

</div>
</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.google.com/recaptcha/api.js"></script>


<script>

var firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "boost-toppers.firebaseapp.com",
  projectId: "boost-toppers",
  storageBucket: "boost-toppers.appspot.com",
  messagingSenderId: "258617068875",
  appId: "PASTE_YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);


window.onload = function(){

window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
'recaptcha-container'
);

recaptchaVerifier.render();

}


function openLogin(){
document.getElementById("loginPopup").style.display="flex";
}

function closeLogin(){
document.getElementById("loginPopup").style.display="none";
}


function sendOTP(){

let mobile = document.getElementById("mobile").value;

if(mobile.length != 10){

alert("Enter valid mobile number");
return;

}

let phoneNumber = "+91" + mobile;

firebase.auth().signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)

.then(function(confirmationResult){

window.confirmationResult = confirmationResult;

alert("OTP Sent Successfully");

})

.catch(function(error){

alert(error.message);

});

}


function verifyOTP(){

let code="";

document.querySelectorAll(".otp-box").forEach((box)=>{
code+=box.value;
});

confirmationResult.confirm(code)

.then(function(){

alert("Login Successful");

})

.catch(function(){

alert("Wrong OTP");

});

}

</script>

</body>
</html>
